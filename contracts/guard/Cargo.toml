[package]
name = "endersift-guard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Endersift spending guard on NEAR: an agent pays only registered, unblocked receivers, inside caps, through a function-call key."
repository = "https://github.com/Chirag126/Endersift"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
